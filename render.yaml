# הגדרות פריסה אוטומטית ל-Render.
# כשמחברים את התיקייה הזו ל-Render ובוחרים "Blueprint", האתר מגדיר הכול לבד.
services:
  - type: web
    name: yom-haaracha
    runtime: node
    plan: starter            # מכונה קטנה שדולקת תמיד (לא "free" — הוא נכבה מעצמו)
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: EXAMINER_PASSWORD
        sync: false           # תגדיר/י סיסמת בוחן משלך בלוח הבקרה של Render
      - key: INTERVIEWER_PASSWORD
        sync: false           # סיסמת המראיינים (מסך /interviewer)
      # ⚠ בלי המפתח הזה מסך הבדיקה עולה ב«מצב הדגמה» ונותן ציונים לפי אורך
      # התשובה בלבד. חובה להגדיר בלוח הבקרה לפני שמריצים בדיקת AI.
      - key: ANTHROPIC_API_KEY
        sync: false
      # טוקן monday.com — לשליחת הציונים ישירות לבורד. אופציונלי:
      # בלעדיו מסך «שלח למאנדיי» פשוט יגיד שאין טוקן.
      - key: MONDAY_API_TOKEN
        sync: false
      - key: DB_PATH
        value: /var/data/assessment.db
      # אופציונלי — ברירות המחדל הן claude-opus-5 ו-medium.
      # ⚠ דווקא השמות האלה: CLAUDE_MODEL/CLAUDE_EFFORT נדרסים ע"י כלי פיתוח אחרים.
      # - key: GRADING_MODEL
      #   value: claude-opus-5
      # - key: GRADING_EFFORT
      #   value: medium
    disk:
      name: data              # דיסק קבוע — כדי שהנתונים ישרדו הפעלה מחדש
      mountPath: /var/data
      sizeGB: 1
